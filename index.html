<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Professor at the Department of Physics, NIT Calicut. Research focuses on optoelectronics, nanomaterials, photodetectors, neuromorphic devices, and light-matter interactions." />
  <title>Dr. Aji A. Anappara | Professor, NIT Calicut</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="crossorigin">

  <style>
    /* ===== CSS VARIABLES & CONFIG ===== */
    :root {
      --bg: #0d0f14;
      --bg-alt: #131720;
      --surface: #1a1f2e;
      --border: #252d3d;
      --accent: #5b8dee;
      --accent2: #7c6af0;
      --text: #e8ecf4;
      --text-muted: #7a87a0;
      --text-dim: #4a5568;
      --card-bg: #151b28;
      --granted: #22c55e;
      --published: #f59e0b;
    }
    [data-theme="light"] {
      --bg: #f5f7fc;
      --bg-alt: #edf0f7;
      --surface: #ffffff;
      --border: #d4dae8;
      --accent: #3b6fd4;
      --accent2: #5b47cc;
      --text: #1a2035;
      --text-muted: #556080;
      --text-dim: #9ba8c0;
      --card-bg: #ffffff;
    }

    html { scroll-behavior: smooth; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }

    /* ===== NAVIGATION ===== */
    .navbar {
      background: rgba(13, 15, 20, 0.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      transition: background 0.3s ease;
    }
    [data-theme="light"] .navbar { 
      background: rgba(245, 247, 252, 0.88); 
    }
    .navbar-brand {
      font-family: 'Playfair Display', serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text) !important;
      letter-spacing: 0.01em;
    }
    .nav-link {
      color: var(--text-muted) !important;
      font-size: 0.85rem;
      font-weight: 500;
      padding: 0.4rem 0.7rem !important;
      border-radius: 6px;
      transition: color 0.2s, background 0.2s;
    }
    .nav-link:hover, .nav-link.active-scroll { 
      color: var(--text) !important; 
      background: var(--surface); 
    }
    .navbar-toggler {
      border-color: var(--border);
      color: var(--text);
    }
    .navbar-toggler-icon {
      filter: invert(1);
    }
    [data-theme="light"] .navbar-toggler-icon {
      filter: invert(0);
    }

    /* ===== HERO ===== */
    .hero {
      min-height: 100vh;
      padding-top: 8rem;
    }
    .hero-dept {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.2rem;
    }
    .hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.5rem, 5.5vw, 4.5rem);
      font-weight: 700;
      line-height: 1.08;
      margin-bottom: 1.2rem;
      color: var(--text);
    }
    .hero-subtitle {
      font-size: 1.05rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    .hero-tag {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--text-muted);
      background: var(--surface);
      letter-spacing: 0.03em;
    }
    .btn-primary {
      padding: 0.75rem 1.8rem;
      background: var(--accent) !important;
      border-color: var(--accent) !important;
      color: #fff !important;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: opacity 0.2s, transform 0.2s;
    }
    .btn-primary:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn-outline {
      padding: 0.75rem 1.8rem;
      border: 1.5px solid var(--border);
      color: var(--text);
      background: transparent;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .btn-outline:hover { border-color: var(--accent); background: var(--surface); color: var(--text); }
    .hero-image-wrap {
      width: 260px; height: 260px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid var(--border);
      background: var(--surface);
      margin: 0 auto;
    }
    @media (min-width: 992px) {
      .hero-image-wrap { width: 280px; height: 280px; }
    }
    .hero-img { width: 100%; height: 100%; object-fit: cover; }

    /* ===== SECTIONS ===== */
    .section-alt { background: var(--bg-alt); }
    .section-label {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.6rem;
    }
    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 700;
      margin-bottom: 1.2rem;
      line-height: 1.15;
    }
    .section-sub {
      font-size: 1rem;
      color: var(--text-muted);
      max-width: 680px;
      margin-bottom: 2.5rem;
    }

    /* ===== ABOUT & TIMELINE ===== */
    .stat-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.2rem;
      text-align: center;
      height: 100%;
    }
    .stat-num {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
    }
    .stat-label { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.4rem; }
    .edu-item { margin-bottom: 1.2rem; padding-bottom: 1.2rem; border-bottom: 1px solid var(--border); }
    .edu-degree { font-weight: 600; font-size: 0.95rem; }
    .edu-inst { font-size: 0.85rem; color: var(--text-muted); margin-top: 0.2rem; }
    
    .timeline { list-style: none; padding-left: 0; }
    .timeline li {
      position: relative;
      padding: 0 0 1.5rem 1.5rem;
      border-left: 2px solid var(--border);
    }
    .timeline li::before {
      content: '';
      position: absolute; left: -5px; top: 0.35rem;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }
    .timeline-role { font-weight: 600; font-size: 0.95rem; }
    .timeline-org { font-size: 0.85rem; color: var(--text-muted); }
    .timeline-period { font-size: 0.78rem; color: var(--text-dim); margin-top: 0.15rem; }

    /* ===== RESEARCH CONFIGS ===== */
    .res-tag-btn {
      padding: 0.45rem 1.1rem;
      border-radius: 999px;
      border: 1.5px solid var(--border);
      background: none;
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .res-tag-btn.active, .res-tag-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--surface);
    }
    .research-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      height: 100%;
      transition: transform 0.2s, border-color 0.2s;
    }
    .research-card:hover { transform: translateY(-3px); border-color: var(--accent); }
    .card-body { padding: 1.3rem; }
    .card-label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.4rem;
    }
    .card-title { font-weight: 600; font-size: 0.95rem; margin-bottom: 0.5rem; }
    .card-desc { font-size: 0.85rem; color: var(--text-muted); line-height: 1.6; }

    /* ===== PUBLICATIONS ===== */
    .pub-filter {
      padding: 0.4rem 1rem;
      border-radius: 999px;
      border: 1.5px solid var(--border);
      background: none;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .pub-filter.active, .pub-filter:hover {
      border-color: var(--accent); color: var(--accent); background: var(--surface);
    }
    .pub-item {
      padding: 1.4rem 0;
      border-bottom: 1px solid var(--border);
    }
    .pub-num {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-dim);
      min-width: 2.5rem;
    }
    .pub-title { font-weight: 600; font-size: 0.95rem; margin-bottom: 0.3rem; line-height: 1.5; }
    .pub-authors { font-size: 0.83rem; color: var(--text-muted); margin-bottom: 0.25rem; }
    .pub-journal { font-size: 0.83rem; color: var(--accent); font-style: italic; margin-bottom: 0.4rem; }
    .pub-tag {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    /* ===== PATENTS ===== */
    .p-stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.5rem 2rem;
      text-align: center;
      min-width: 140px;
    }
    .p-stat-num {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
    }
    .p-stat-label { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.3rem; }
    .patent-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.4rem 1.6rem;
    }
    .patent-status {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.25rem 0.7rem;
      border-radius: 4px;
    }
    .patent-status.granted { background: rgba(34,197,94,0.12); color: var(--granted); }
    .patent-status.published { background: rgba(245,158,11,0.12); color: var(--published); }
    .patent-year { font-size: 0.8rem; color: var(--text-dim); }
    .patent-title { font-weight: 600; font-size: 0.93rem; margin-bottom: 0.4rem; line-height: 1.5; }
    .patent-appno { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.3rem; font-family: monospace; }
    .patent-inventors { font-size: 0.82rem; color: var(--text-muted); }

    /* ===== STUDENTS & GROUP ===== */
    .course-group-title, .students-group-title {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 1.2rem;
    }
    .student-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.2rem 1.4rem;
      transition: border-color 0.2s;
    }
    .student-card:hover { border-color: var(--accent); }
    .student-name { font-weight: 600; font-size: 0.93rem; margin-bottom: 0.3rem; }
    .student-topic { font-size: 0.83rem; color: var(--text-muted); line-height: 1.5; }
    .student-note { font-size: 0.75rem; color: var(--accent); margin-top: 0.3rem; font-style: italic; }

    /* ===== ACADEMICS & COURSES ===== */
    .course-item {
      padding: 0.85rem 0;
      border-bottom: 1px solid var(--border);
    }
    .course-code {
      font-family: monospace;
      font-size: 0.8rem;
      color: var(--accent);
      font-weight: 700;
      min-width: 80px;
      display: inline-block;
    }
    .course-name { font-size: 0.92rem; }
    .join-box, .contact-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem 2.5rem;
    }
    .join-box h4, .contact-box h4 {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      margin-bottom: 1rem;
    }
